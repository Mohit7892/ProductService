spring.application.name=productservice

##Log level
logging.level.org.springframework.web=TRACE

##DB Connection properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/productservicemar26
spring.datasource.username=productservicemar26user
##spring.datasource.password=secret --##No password is defined for our DB

#Eureke client properties
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

#to enable running multiple instances on different ports
server.port=${port}
